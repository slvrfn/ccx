name: ccx-platform
services:
  etcd:
    image: ${ETCD_IMAGE}
    command: etcd -advertise-client-urls=http://etcd:2379 -listen-client-urls=http://0.0.0.0:2379 --data-dir=/etcd
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    volumes:
      - etcd-data:/etcd
    networks: [context-net]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 10s
      timeout: 5s
      retries: 12
  minio:
    image: ${MINIO_IMAGE}
    command: minio server /minio_data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio-data:/minio_data
    ports:
      - "127.0.0.1:${MINIO_CONSOLE_PORT}:9001"
    networks: [context-net]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 12
  milvus:
    image: ${MILVUS_IMAGE}
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MINIO_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      MINIO_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
    volumes:
      - milvus-data:/var/lib/milvus
    ports:
      - "127.0.0.1:${MILVUS_PORT}:19530"
    networks: [context-net]
    depends_on:
      etcd: {condition: service_healthy}
      minio: {condition: service_healthy}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s
  attu:
    image: ${ATTU_IMAGE}
    profiles: [ui]
    environment:
      MILVUS_URL: milvus:19530
    ports:
      - "127.0.0.1:${ATTU_PORT}:3000"
    networks: [context-net]
    depends_on:
      milvus: {condition: service_healthy}
    restart: unless-stopped
networks:
  context-net:
    name: context-net
volumes:
  etcd-data:
  minio-data:
  milvus-data:

